  <text x="32" y="504" class="row-title">Mon 19 Oct</text>
  <text x="32" y="523" class="row-sub">8h 00m · 2 stamps</text>
  <rect x="286" y="490" width="58" height="24" rx="12" fill="#8E8E93" fill-opacity="0.14"/>
  <text x="315" y="506" text-anchor="middle" class="pill" fill="#6D6D72">0m</text>
  <path d="M 362 497 l 5 5 l -5 5" fill="none" stroke="#C7C7CC" stroke-width="2"/>
  <line x1="32" y1="536" x2="358" y2="536" stroke="#E5E5EA" stroke-width="1"/>

  <!-- row 5 -->
  <text x="32" y="566" class="row-title">Fri 18 Oct</text>
  <text x="32" y="585" class="row-sub">6h 55m · 4 stamps</text>
  <rect x="286" y="552" width="58" height="24" rx="12" fill="#FF3B30" fill-opacity="0.14"/>
  <text x="315" y="568" text-anchor="middle" class="pill" fill="#C1272D">−1h 05m</text>
  <path d="M 362 559 l 5 5 l -5 5" fill="none" stroke="#C7C7CC" stroke-width="2"/>
  <path d="M 284 558 l 6 10 h -12 z" fill="#FF9500"/>
  <text x="284" y="567" text-anchor="middle" font-size="7" font-weight="700" fill="#FFFFFF">!</text>

  <!-- tab bar -->
  <rect x="0" y="768" width="390" height="76" fill="#F9F9F9"/>
  <line x1="0" y1="768" x2="390" y2="768" stroke="#E5E5EA" stroke-width="1"/>

  <g fill="none" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round">
    <circle cx="65" cy="792" r="8"/>
    <path d="M 65 787 v 5 l 3 2"/>
