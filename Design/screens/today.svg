<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .title { font-size: 34px; font-weight: 700; letter-spacing: -0.6px; }
    .card-date { font-size: 12px; fill: #8E8E93; }
    .state { font-size: 15px; fill: #000; }
    .big { font-size: 40px; font-weight: 700; letter-spacing: -1px; }
    .target { font-size: 15px; fill: #8E8E93; }
    .leave { font-size: 15px; font-weight: 600; fill: #007AFF; }
    .row-label { font-size: 15px; fill: #8E8E93; }
    .row-time { font-size: 17px; font-weight: 500; fill: #000; }
    .stat-title { font-size: 11px; fill: #8E8E93; }
    .stat-value { font-size: 14px; font-weight: 600; }
    .tab { font-size: 10px; font-weight: 500; }
    .status { font-size: 15px; font-weight: 600; }
  </style>

  <rect width="390" height="844" fill="#F2F2F7"/>

  <!-- status bar -->
  <text x="28" y="34" class="status" fill="#000">9:41</text>
  <g fill="#000">
    <rect x="294" y="27" width="3" height="4" rx="1"/>
    <rect x="299" y="25" width="3" height="6" rx="1"/>
    <rect x="304" y="23" width="3" height="8" rx="1"/>
    <rect x="309" y="21" width="3" height="10" rx="1"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round">
    <path d="M 322 27 A 9 9 0 0 1 336 27"/>
    <path d="M 325.5 30.5 A 6 6 0 0 1 332.5 30.5"/>
  </g>
  <circle cx="329" cy="33.5" r="1.2" fill="#000"/>
  <rect x="345" y="22" width="23" height="12" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="347" y="24" width="17" height="8" rx="2" fill="#000"/>
  <rect x="369" y="26" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/>

  <!-- title -->
  <text x="20" y="98" class="title" fill="#000">Today</text>
  <g fill="none" stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 345 78 h 16 v 16 h -16 z" stroke-opacity="0.35"/>
    <path d="M 350 92 l 9 -9 4 4 -9 9 -5 1 z"/>
  </g>

  <!-- state card -->
  <rect x="16" y="116" width="358" height="170" rx="20" fill="#FFFFFF"/>
  <text x="32" y="144" class="card-date">Thursday 22 October</text>
  <text x="32" y="168" class="state">Working since 13:14</text>
  <text x="32" y="212" class="big" fill="#000">6h 42m</text>
  <text x="176" y="212" class="target">/ 8h 00m</text>
  <text x="32" y="242" class="leave">Leave at 16:46</text>

  <circle cx="320" cy="204" r="32" fill="none" stroke="#E5E5EA" stroke-width="9"/>
  <path d="M 320 172 A 32 32 0 1 1 292.98 186.85" fill="none" stroke="#007AFF" stroke-width="9" stroke-linecap="round"/>
  <text x="320" y="208" text-anchor="middle" font-size="10" font-weight="600" fill="#000">84%</text>

  <!-- stamp button -->
  <rect x="16" y="302" width="358" height="60" rx="20" fill="#007AFF"/>
  <text x="195" y="339" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">Stamp out</text>

  <!-- timeline card -->
  <rect x="16" y="378" width="358" height="186" rx="20" fill="#FFFFFF"/>
  <text x="32" y="412" class="row-label">In</text>
  <text x="358" y="412" text-anchor="end" class="row-time">08:28</text>
  <line x1="32" y1="458" x2="358" y2="458" stroke="#E5E5EA" stroke-width="1"/>

  <text x="32" y="454" class="row-label">Lunch out</text>
  <text x="358" y="454" text-anchor="end" class="row-time">12:31</text>
  <line x1="32" y1="500" x2="358" y2="500" stroke="#E5E5EA" stroke-width="1"/>

  <text x="32" y="496" class="row-label">Back in</text>
  <text x="358" y="496" text-anchor="end" class="row-time">13:14</text>
  <line x1="32" y1="542" x2="358" y2="542" stroke="#E5E5EA" stroke-width="1"/>

  <text x="32" y="538" class="row-label">Out</text>
  <text x="358" y="538" text-anchor="end" class="row-time" fill="#C7C7CC">—</text>

  <!-- balances card -->
  <rect x="16" y="582" width="358" height="62" rx="20" fill="#FFFFFF"/>
  <text x="75" y="606" text-anchor="middle" class="stat-title">Today</text>
  <text x="75" y="626" text-anchor="middle" class="stat-value" fill="#248A3D">+0h 42m</text>
  <line x1="135" y1="596" x2="135" y2="630" stroke="#E5E5EA" stroke-width="1"/>

  <text x="195" y="606" text-anchor="middle" class="stat-title">Week</text>
  <text x="195" y="626" text-anchor="middle" class="stat-value" fill="#248A3D">+2h 10m</text>
  <line x1="255" y1="596" x2="255" y2="630" stroke="#E5E5EA" stroke-width="1"/>

  <text x="315" y="606" text-anchor="middle" class="stat-title">Month</text>
  <text x="315" y="626" text-anchor="middle" class="stat-value" fill="#C1272D">−1h 05m</text>

  <!-- tab bar -->
  <rect x="0" y="768" width="390" height="76" fill="#F9F9F9"/>
  <line x1="0" y1="768" x2="390" y2="768" stroke="#E5E5EA" stroke-width="1"/>

  <g fill="none" stroke="#007AFF" stroke-width="1.8" stroke-linecap="round">
    <circle cx="65" cy="792" r="8"/>
    <path d="M 65 787 v 5 l 3 2"/>
  </g>
  <text x="65" y="816" text-anchor="middle" class="tab" fill="#007AFF">Today</text>

  <g fill="none" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round">
    <rect x="187" y="784" width="16" height="14" rx="3"/>
    <path d="M 187 789 h 16 M 191 782 v 4 M 199 782 v 4"/>
  </g>
  <text x="195" y="816" text-anchor="middle" class="tab" fill="#8E8E93">History</text>

  <g fill="none" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round">
    <path d="M 318 786 h 14 M 318 792 h 14 M 318 798 h 14"/>
    <circle cx="323" cy="786" r="2" fill="#F9F9F9"/>
    <circle cx="329" cy="792" r="2" fill="#F9F9F9"/>
    <circle cx="321" cy="798" r="2" fill="#F9F9F9"/>
  </g>
  <text x="325" y="816" text-anchor="middle" class="tab" fill="#8E8E93">Settings</text>

  <rect x="128" y="830" width="134" height="5" rx="2.5" fill="#000"/>
</svg>
